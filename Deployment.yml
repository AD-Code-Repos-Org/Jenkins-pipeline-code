apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomato
  labels:
    app: zomato
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      name: zomatopod
      labels:
        app: zomato
    spec:
      containers:
        - name: zomato
          image: <dockerhub-username>/zomato
          resources:
            limits:
              cpu: 10m

---
apiVersion: v1
kind: Service
metadata:
  name: zomato-svc
spec:
  type: ClusterIP  ## this is default if we do not type in service definition
  selector:
    app: zomato
  ports:
   - protocol: TCP
     port: 3000
     targetPort: 3000

---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: zomato-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zomato
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 5